services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rkai
      POSTGRES_USER: rkai
      POSTGRES_PASSWORD: rkai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rkai -d rkai"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: dev-only-rkai-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,backend
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rkai
      POSTGRES_USER: rkai
      POSTGRES_PASSWORD: rkai
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://127.0.0.1:8000/api
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
